<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF9D">
        <animate attributeName="stop-color" values="#00FF9D;#00D4FF;#7928CA;#00FF9D" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#00D4FF">
        <animate attributeName="stop-color" values="#00D4FF;#7928CA;#00FF9D;#00D4FF" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#7928CA">
        <animate attributeName="stop-color" values="#7928CA;#00FF9D;#00D4FF;#7928CA" dur="7s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="titleGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>

    <filter id="repoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseCard { 0%, 100% { filter: drop-shadow(0 0 4px rgba(0,255,157,0.4)); } 50% { filter: drop-shadow(0 0 12px rgba(0,212,255,0.7)); } }
    .card-bg { fill: #080C14; }
    .mono { font-family: 'Fira Code', 'Courier New', monospace; }
    .brand { font-family: system-ui, -apple-system, sans-serif; font-weight: 900; }
    .glow-title { animation: pulseCard 4s ease-in-out infinite; }
  </style>

  <!-- Frame -->
  <rect x="2" y="2" width="896" height="206" rx="12" class="card-bg" stroke="url(#cardBorder)" stroke-width="1.8" />

  <!-- Top Ribbon -->
  <rect x="2" y="2" width="896" height="32" rx="12" fill="#0D1322" />
  <line x1="2" y1="34" x2="898" y2="34" stroke="#1F2937" stroke-width="1" />
  
  <text x="24" y="22" class="mono" font-size="11" fill="#00FF9D" font-weight="bold">◈ FLAGSHIP ARTIFACT // PUBLIC OPEN SOURCE ENGINE</text>
  <text x="876" y="22" text-anchor="end" class="mono" font-size="10.5" fill="#8B949E">STATUS: [PRODUCTION READY · v1.0.0]</text>

  <!-- Content -->
  <g transform="translate(30, 56)">
    
    <!-- Title & Subtitle -->
    <text x="0" y="22" class="brand glow-title" font-size="24" fill="url(#titleGlowGrad)" letter-spacing="2">QURANICWORDS</text>
    <text x="210" y="20" class="mono" font-size="11" fill="#BD93F9" font-weight="bold">[ANDROID NATIVE]</text>

    <text x="0" y="46" class="mono" font-size="12" fill="#E6EDF3">
      Master <tspan fill="#00FF9D" font-weight="bold">4,709 Quranic Lemmas</tspan> across <tspan fill="#00D4FF">10 Chapters, 100 Sections, 1,217 Lessons, 14,358 Exercises</tspan>.
    </text>
    <text x="0" y="66" class="mono" font-size="11.5" fill="#8B949E">
      Covering 59,888 occurrences (~80%+ of the Qur'an) in descending frequency.
    </text>

    <!-- Tech Stack Badges Row -->
    <g transform="translate(0, 88)" class="mono" font-size="10.5">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="88" height="22" rx="5" fill="#131C2E" stroke="#00FF9D" stroke-width="1" />
      <text x="44" y="15" text-anchor="middle" fill="#00FF9D" font-weight="bold">Kotlin 2.3</text>

      <!-- Badge 2 -->
      <rect x="96" y="0" width="128" height="22" rx="5" fill="#131C2E" stroke="#00D4FF" stroke-width="1" />
      <text x="160" y="15" text-anchor="middle" fill="#00D4FF" font-weight="bold">Jetpack Compose</text>

      <!-- Badge 3 -->
      <rect x="232" y="0" width="94" height="22" rx="5" fill="#131C2E" stroke="#BD93F9" stroke-width="1" />
      <text x="279" y="15" text-anchor="middle" fill="#BD93F9" font-weight="bold">Material 3</text>

      <!-- Badge 4 -->
      <rect x="334" y="0" width="94" height="22" rx="5" fill="#131C2E" stroke="#FFB86C" stroke-width="1" />
      <text x="381" y="15" text-anchor="middle" fill="#FFB86C" font-weight="bold">Room SQLite</text>

      <!-- Badge 5 -->
      <rect x="436" y="0" width="102" height="22" rx="5" fill="#131C2E" stroke="#50FA7B" stroke-width="1" />
      <text x="487" y="15" text-anchor="middle" fill="#50FA7B" font-weight="bold">Hilt / MVVM</text>
    </g>

    <!-- Security/Privacy Badges (Right Column) -->
    <g transform="translate(610, 8)" class="mono" font-size="11">
      <rect x="0" y="0" width="230" height="24" rx="4" fill="#0D1A16" stroke="#00FF9D" stroke-width="1" />
      <circle cx="14" cy="12" r="3.5" fill="#00FF9D" />
      <text x="26" y="16" fill="#00FF9D" font-weight="bold">100% OFFLINE-FIRST</text>

      <rect x="0" y="32" width="230" height="24" rx="4" fill="#0D1620" stroke="#00D4FF" stroke-width="1" />
      <circle cx="14" cy="44" r="3.5" fill="#00D4FF" />
      <text x="26" y="48" fill="#00D4FF" font-weight="bold">ZERO NETWORK REQUESTS</text>

      <rect x="0" y="64" width="230" height="24" rx="4" fill="#181126" stroke="#BD93F9" stroke-width="1" />
      <circle cx="14" cy="76" r="3.5" fill="#BD93F9" />
      <text x="26" y="80" fill="#BD93F9" font-weight="bold">ZERO USER TELEMETRY</text>

      <rect x="0" y="96" width="230" height="24" rx="4" fill="#1A1810" stroke="#FFB86C" stroke-width="1" />
      <circle cx="14" cy="108" r="3.5" fill="#FFB86C" />
      <text x="26" y="112" fill="#FFB86C" font-weight="bold">PURE LOCAL STORAGE</text>
    </g>

  </g>
</svg>
