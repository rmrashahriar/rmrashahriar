<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="100%">
  <defs>
    <linearGradient id="meterGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>
    <linearGradient id="meterGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF9D">
        <animate attributeName="stop-color" values="#00FF9D;#00D4FF;#7928CA;#00FF9D" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#00D4FF">
        <animate attributeName="stop-color" values="#00D4FF;#7928CA;#00FF9D;#00D4FF" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#7928CA">
        <animate attributeName="stop-color" values="#7928CA;#00FF9D;#00D4FF;#7928CA" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="hudGlow">
      <feGaussianBlur stdDeviation="2" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulsePulse { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.4; } }
    @keyframes barFill { 0% { width: 0px; } 100% { width: 320px; } }
    .hud-title { font-family: 'Fira Code', monospace; font-size: 11px; fill: #8B949E; font-weight: bold; }
    .hud-val { font-family: 'Fira Code', monospace; font-size: 11px; fill: #00FF9D; font-weight: bold; }
    .mono { font-family: 'Fira Code', monospace; }
    .pulse-dot { animation: pulsePulse 1.8s infinite; fill: #00FF9D; }
  </style>

  <!-- Frame -->
  <rect x="2" y="2" width="846" height="196" rx="10" fill="#080C14" stroke="url(#borderGrad)" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <rect x="2" y="2" width="846" height="32" rx="10" fill="#0D121F" />
  <line x1="2" y1="34" x2="848" y2="34" stroke="#1F2937" stroke-width="1" />
  
  <circle cx="20" cy="18" r="4" class="pulse-dot" filter="url(#hudGlow)" />
  <text x="32" y="22" font-family="'Fira Code', monospace" font-size="11" fill="#00FF9D" font-weight="bold">SYSTEM TELEMETRY // HARDENED RUNTIME METRICS</text>
  <text x="825" y="22" text-anchor="end" font-family="'Fira Code', monospace" font-size="10" fill="#8B949E">STATUS: [ENFORCING]</text>

  <!-- Left Column Telemetry -->
  <g transform="translate(30, 60)">
    <!-- Metric 1 -->
    <text x="0" y="0" class="hud-title">SYSTEM INTEGRITY &amp; ATTESTATION</text>
    <text x="360" y="0" text-anchor="end" class="hud-val">100% [OPTIMAL]</text>
    <rect x="0" y="8" width="360" height="10" rx="3" fill="#161B22" />
    <rect x="0" y="8" width="360" height="10" rx="3" fill="url(#meterGrad1)" filter="url(#hudGlow)" />

    <!-- Metric 2 -->
    <text x="0" y="45" class="hud-title">AIR-GAP &amp; ISOLATION LEVEL</text>
    <text x="360" y="45" text-anchor="end" class="hud-val">100% [AIR-GAPPED]</text>
    <rect x="0" y="53" width="360" height="10" rx="3" fill="#161B22" />
    <rect x="0" y="53" width="360" height="10" rx="3" fill="url(#meterGrad1)" filter="url(#hudGlow)" />

    <!-- Metric 3 -->
    <text x="0" y="90" class="hud-title">DEFENSIVE SECURITY BARRIER</text>
    <text x="360" y="90" text-anchor="end" class="hud-val">100% [SHIELD ACTIVE]</text>
    <rect x="0" y="98" width="360" height="10" rx="3" fill="#161B22" />
    <rect x="0" y="98" width="360" height="10" rx="3" fill="url(#meterGrad2)" filter="url(#hudGlow)" />
  </g>

  <!-- Right Column Telemetry -->
  <g transform="translate(450, 60)">
    <!-- Metric 4 -->
    <text x="0" y="0" class="hud-title">ZERO-TELEMETRY COMPLIANCE</text>
    <text x="360" y="0" text-anchor="end" class="hud-val">100% [VERIFIED]</text>
    <rect x="0" y="8" width="360" height="10" rx="3" fill="#161B22" />
    <rect x="0" y="8" width="360" height="10" rx="3" fill="url(#meterGrad1)" filter="url(#hudGlow)" />

    <!-- Metric 5 -->
    <text x="0" y="45" class="hud-title">CLOUD LEAK / TELEMETRY DEPENDENCY</text>
    <text x="360" y="45" text-anchor="end" font-family="'Fira Code', monospace" font-size="11" fill="#7EE787" font-weight="bold">0% [NONE]</text>
    <rect x="0" y="53" width="360" height="10" rx="3" fill="#161B22" />
    <rect x="0" y="53" width="4" height="10" rx="2" fill="#00FF9D" />

    <!-- Metric 6 -->
    <text x="0" y="90" class="hud-title">ATTACK SURFACE EXPOSURE</text>
    <text x="360" y="90" text-anchor="end" font-family="'Fira Code', monospace" font-size="11" fill="#7EE787" font-weight="bold">0% [ZERO ATTACK SURFACE]</text>
    <rect x="0" y="98" width="360" height="10" rx="3" fill="#161B22" />
    <rect x="0" y="98" width="4" height="10" rx="2" fill="#00FF9D" />
  </g>

  <!-- Bottom Footer Line -->
  <line x1="30" y1="185" x2="820" y2="185" stroke="#1F2937" stroke-width="1" />
</svg>
