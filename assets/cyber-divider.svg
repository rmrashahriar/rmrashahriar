<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 24" width="100%" height="24">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D" stop-opacity="0" />
      <stop offset="25%" stop-color="#00FF9D" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#00FF9D" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00FF9D" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D" stop-opacity="0">
        <animate attributeName="offset" values="0; 0.8; 0" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#00FF9D" stop-opacity="1">
        <animate attributeName="offset" values="0.1; 0.9; 0.1" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0">
        <animate attributeName="offset" values="0.2; 1; 0.2" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="divGlow">
      <feGaussianBlur stdDeviation="2.5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Line -->
  <line x1="0" y1="12" x2="850" y2="12" stroke="url(#divGrad)" stroke-width="1.5" />
  <!-- Scanning Light Beam -->
  <line x1="0" y1="12" x2="850" y2="12" stroke="url(#scanBeam)" stroke-width="2.5" filter="url(#divGlow)" />
  <!-- Center Cyber Node Diamond -->
  <g transform="translate(425, 12)">
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#00FF9D" filter="url(#divGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite" />
    </polygon>
    <circle cx="0" cy="0" r="2" fill="#05090F" />
  </g>
</svg>
