<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A12" />
      <stop offset="50%" stop-color="#0A1120" />
      <stop offset="100%" stop-color="#060A12" />
    </linearGradient>

    <!-- Neon Text Gradient -->
    <linearGradient id="cyberTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D" />
      <stop offset="50%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#BD93F9" />
    </linearGradient>

    <!-- Shifting Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF9D">
        <animate attributeName="stop-color" values="#00FF9D;#00D4FF;#7928CA;#00FF9D" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#00D4FF">
        <animate attributeName="stop-color" values="#00D4FF;#7928CA;#00FF9D;#00D4FF" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#7928CA">
        <animate attributeName="stop-color" values="#7928CA;#00FF9D;#00D4FF;#7928CA" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Pulse Laser Scan -->
    <linearGradient id="headerLaser" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF9D" stop-opacity="0" />
      <stop offset="50%" stop-color="#00FF9D" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Matrix Pattern -->
    <pattern id="dotPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#131C2E" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseCircuits { 0%, 100% { stroke-opacity: 0.2; } 50% { stroke-opacity: 0.85; stroke: #00FF9D; } }
    @keyframes laserSweep { 0% { transform: translateY(-40px); } 100% { transform: translateY(240px); } }
    @keyframes beaconBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    @keyframes glowTitle { 0%, 100% { filter: drop-shadow(0 0 6px rgba(0,255,157,0.5)); } 50% { filter: drop-shadow(0 0 16px rgba(0,212,255,0.8)); } }

    .circuit-line { stroke: #1E293B; stroke-width: 1.5; fill: none; }
    .active-circuit { animation: pulseCircuits 3.5s ease-in-out infinite; stroke-width: 2; fill: none; }
    .laser-line { animation: laserSweep 4s linear infinite; }
    .beacon { animation: beaconBlink 1.4s infinite; }
    .hero-title { animation: glowTitle 5s ease-in-out infinite; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .mono-meta { font-family: 'Fira Code', 'Courier New', monospace; }
  </style>

  <!-- Background Frame -->
  <rect x="2" y="2" width="896" height="226" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />
  <rect x="4" y="4" width="892" height="222" rx="12" fill="url(#dotPattern)" />

  <!-- Animated Circuit Traces (Left Side) -->
  <g class="active-circuit">
    <path d="M 10 40 L 90 40 L 130 80 L 180 80" stroke="#00D4FF" />
    <circle cx="180" cy="80" r="3.5" fill="#00D4FF" filter="url(#hGlow)" />

    <path d="M 10 110 L 70 110 L 110 150 L 210 150" stroke="#00FF9D" />
    <circle cx="210" cy="150" r="3.5" fill="#00FF9D" filter="url(#hGlow)" />

    <path d="M 10 180 L 120 180 L 150 150" stroke="#7928CA" />
  </g>

  <!-- Animated Circuit Traces (Right Side) -->
  <g class="active-circuit">
    <path d="M 890 40 L 810 40 L 770 80 L 720 80" stroke="#00FF9D" />
    <circle cx="720" cy="80" r="3.5" fill="#00FF9D" filter="url(#hGlow)" />

    <path d="M 890 110 L 830 110 L 790 150 L 690 150" stroke="#00D4FF" />
    <circle cx="690" cy="150" r="3.5" fill="#00D4FF" filter="url(#hGlow)" />

    <path d="M 890 180 L 780 180 L 750 150" stroke="#7928CA" />
  </g>

  <!-- Top Security Status Bar -->
  <g transform="translate(450, 36)" text-anchor="middle" class="mono-meta">
    <circle cx="-160" cy="-4" r="4" fill="#00FF9D" class="beacon" filter="url(#hGlow)" />
    <text x="0" y="0" font-size="11" fill="#00FF9D" letter-spacing="3" font-weight="bold">MAINFRAME PROTOCOL ACTIVE // HIGH-ASSURANCE CORE</text>
  </g>

  <!-- Central Laser-Straight Hero Brand -->
  <g transform="translate(450, 112)" text-anchor="middle">
    <!-- Corner HUD Brackets -->
    <path d="M -160 -40 L -180 -40 L -180 -15" stroke="#00FF9D" stroke-width="2.5" fill="none" />
    <path d="M 160 -40 L 180 -40 L 180 -15" stroke="#00FF9D" stroke-width="2.5" fill="none" />
    <path d="M -160 30 L -180 30 L -180 5" stroke="#00FF9D" stroke-width="2.5" fill="none" />
    <path d="M 160 30 L 180 30 L 180 5" stroke="#00FF9D" stroke-width="2.5" fill="none" />

    <!-- Perfectly Straight Vector Typography for RAFI -->
    <text x="0" y="2" class="hero-title" font-size="56" font-weight="900" fill="url(#cyberTextGrad)" letter-spacing="12" filter="url(#hGlow)">RAFI</text>
  </g>

  <!-- Sub-Heading Disciplines -->
  <g transform="translate(450, 172)" text-anchor="middle" class="mono-meta">
    <text x="0" y="0" font-size="12" fill="#E6EDF3" font-weight="600" letter-spacing="4">
      <tspan fill="#00FF9D">SYSTEMS ARCHITECTURE</tspan>
      <tspan fill="#4B5563"> • </tspan>
      <tspan fill="#00D4FF">DEFENSIVE SECURITY</tspan>
      <tspan fill="#4B5563"> • </tspan>
      <tspan fill="#BD93F9">ANDROID ENGINEERING</tspan>
    </text>
    <text x="0" y="24" font-size="10.5" fill="#8B949E" letter-spacing="2">ZERO-TELEMETRY  ·  HIGH-ASSURANCE  ·  OFFLINE-FIRST</text>
  </g>

  <!-- Scanning Laser Bar -->
  <rect x="4" y="0" width="892" height="30" fill="url(#headerLaser)" class="laser-line" pointer-events="none" />
</svg>
