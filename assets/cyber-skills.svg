<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" height="100%">
  <defs>
    <!-- Border Gradient (Matrix Green & Cyan) -->
    <linearGradient id="skBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF9D">
        <animate attributeName="stop-color" values="#00FF9D;#00E5FF;#00FF66;#00FF9D" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#00E5FF">
        <animate attributeName="stop-color" values="#00E5FF;#00FF66;#00FF9D;#00E5FF" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00FF66">
        <animate attributeName="stop-color" values="#00FF66;#00FF9D;#00E5FF;#00FF66" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Progress Meter Gradients (Matrix Green & Electric Cyan) -->
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00FF9D" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="skGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes barPulse { 0%, 100% { filter: drop-shadow(0 0 4px #00FF9D); } 50% { filter: drop-shadow(0 0 10px #00E5FF); } }
    .hud-box { fill: #05090F; }
    .mono-hdr { font-family: 'Fira Code', 'Courier New', monospace; font-size: 12px; fill: #64748B; }
    .mono-lbl { font-family: 'Fira Code', 'Courier New', monospace; font-size: 12px; fill: #E6EDF3; font-weight: 600; }
    .mono-pct { font-family: 'Fira Code', 'Courier New', monospace; font-size: 11.5px; fill: #00FF9D; font-weight: bold; }
    .pulse-meter { animation: barPulse 3.5s ease-in-out infinite; }
  </style>

  <!-- Frame -->
  <rect x="2" y="2" width="896" height="246" rx="12" class="hud-box" stroke="url(#skBorder)" stroke-width="1.8" />

  <!-- Header -->
  <rect x="2" y="2" width="896" height="34" rx="12" fill="#08121A" />
  <line x1="2" y1="36" x2="898" y2="36" stroke="#162E25" stroke-width="1" />
  
  <text x="24" y="23" class="mono-hdr" fill="#00FF9D" font-weight="bold">◈ CYBERSECURITY ARSENAL // OFFENSIVE &amp; EXPLOIT DEV MATRIX</text>
  <text x="876" y="23" text-anchor="end" class="mono-hdr" fill="#00E5FF">POSTURE: [RED TEAM // ENGAGED]</text>

  <!-- Skills Rows -->
  <g transform="translate(24, 62)">
    
    <!-- Skill 1: Python Exploit Dev -->
    <text x="0" y="0" class="mono-lbl">🐍 PYTHON EXPLOIT DEV &amp; SECURITY AUTOMATION <tspan fill="#64748B" font-weight="normal">(Sockets · Scapy · Requests · PoCs · Custom Scanners)</tspan></text>
    <text x="850" y="0" text-anchor="end" class="mono-pct" fill="#00FF9D">98% [LETHAL]</text>
    <rect x="0" y="8" width="850" height="9" rx="3" fill="#0C1A16" />
    <rect x="0" y="8" width="833" height="9" rx="3" fill="url(#barGrad1)" class="pulse-meter" />

    <!-- Skill 2: Penetration Testing -->
    <text x="0" y="42" class="mono-lbl">⚔️ PENETRATION TESTING &amp; RED TEAMING <tspan fill="#64748B" font-weight="normal">(Metasploit · Nmap · Burp Suite · Privilege Escalation)</tspan></text>
    <text x="850" y="42" text-anchor="end" class="mono-pct" fill="#00E5FF">96% [ENGAGED]</text>
    <rect x="0" y="50" width="850" height="9" rx="3" fill="#0C1A16" />
    <rect x="0" y="50" width="816" height="9" rx="3" fill="url(#barGrad2)" class="pulse-meter" />

    <!-- Skill 3: Reverse Engineering -->
    <text x="0" y="84" class="mono-lbl">🔍 REVERSE ENGINEERING &amp; BINARY ANALYSIS <tspan fill="#64748B" font-weight="normal">(Ghidra · Frida Dynamic Instrumentation · IDA · GDB)</tspan></text>
    <text x="850" y="84" text-anchor="end" class="mono-pct" fill="#00FF9D">94% [CRACKED]</text>
    <rect x="0" y="92" width="850" height="9" rx="3" fill="#0C1A16" />
    <rect x="0" y="92" width="799" height="9" rx="3" fill="url(#barGrad1)" class="pulse-meter" />

    <!-- Skill 4: Android AppSec -->
    <text x="0" y="126" class="mono-lbl">📱 ANDROID SECURITY &amp; MOBILE APPSEC <tspan fill="#64748B" font-weight="normal">(APK Decompilation · Hooking · Smali · MobSF · Root Bypass)</tspan></text>
    <text x="850" y="126" text-anchor="end" class="mono-pct" fill="#00E5FF">95% [AUDITED]</text>
    <rect x="0" y="134" width="850" height="9" rx="3" fill="#0C1A16" />
    <rect x="0" y="134" width="807" height="9" rx="3" fill="url(#barGrad2)" class="pulse-meter" />

    <!-- Skill 5: Linux Passionate & Systems -->
    <text x="0" y="168" class="mono-lbl">🐧 LINUX PASSIONATE &amp; SYSTEMS HARDENING <tspan fill="#64748B" font-weight="normal">(Kernel Internals · Shellcraft · C/C++ · SELinux · POSIX)</tspan></text>
    <text x="850" y="168" text-anchor="end" class="mono-pct" fill="#00FF9D">95% [ROOTED]</text>
    <rect x="0" y="176" width="850" height="9" rx="3" fill="#0C1A16" />
    <rect x="0" y="176" width="807" height="9" rx="3" fill="url(#barGrad1)" class="pulse-meter" />

  </g>
</svg>
