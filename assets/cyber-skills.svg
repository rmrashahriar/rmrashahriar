<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" height="100%">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="skBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF9D">
        <animate attributeName="stop-color" values="#00FF9D;#00D4FF;#7928CA;#00FF9D" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#00D4FF">
        <animate attributeName="stop-color" values="#00D4FF;#7928CA;#00FF9D;#00D4FF" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#7928CA">
        <animate attributeName="stop-color" values="#7928CA;#00FF9D;#00D4FF;#7928CA" dur="7s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Progress Meter Gradients -->
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#00FF9D" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="skGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes barPulse { 0%, 100% { filter: drop-shadow(0 0 3px #00FF9D); } 50% { filter: drop-shadow(0 0 8px #00D4FF); } }
    .hud-box { fill: #080C14; }
    .mono-hdr { font-family: 'Fira Code', 'Courier New', monospace; font-size: 12px; fill: #8B949E; }
    .mono-lbl { font-family: 'Fira Code', 'Courier New', monospace; font-size: 12px; fill: #E6EDF3; font-weight: 600; }
    .mono-pct { font-family: 'Fira Code', 'Courier New', monospace; font-size: 11.5px; fill: #00FF9D; font-weight: bold; }
    .pulse-meter { animation: barPulse 4s ease-in-out infinite; }
  </style>

  <!-- Frame -->
  <rect x="2" y="2" width="896" height="246" rx="12" class="hud-box" stroke="url(#skBorder)" stroke-width="1.8" />

  <!-- Header -->
  <rect x="2" y="2" width="896" height="34" rx="12" fill="#0D1322" />
  <line x1="2" y1="36" x2="898" y2="36" stroke="#1F2937" stroke-width="1" />
  
  <text x="24" y="23" class="mono-hdr" fill="#00FF9D" font-weight="bold">◈ COMBAT ARSENAL // PROFICIENCY &amp; RUNTIME MATRIX</text>
  <text x="876" y="23" text-anchor="end" class="mono-hdr" fill="#8B949E">ACTIVE ARSENAL: [SYSTEM-HIGH]</text>

  <!-- Skills Rows -->
  <g transform="translate(24, 62)">
    
    <!-- Skill 1 -->
    <text x="0" y="0" class="mono-lbl">📱 ANDROID PLATFORM ARCHITECTURE <tspan fill="#8B949E" font-weight="normal">(Kotlin 2.3 · Compose · Room · Coroutines/Flow)</tspan></text>
    <text x="850" y="0" text-anchor="end" class="mono-pct">98% [MASTERED]</text>
    <rect x="0" y="8" width="850" height="9" rx="3" fill="#161B22" />
    <rect x="0" y="8" width="833" height="9" rx="3" fill="url(#barGrad1)" class="pulse-meter" />

    <!-- Skill 2 -->
    <text x="0" y="42" class="mono-lbl">🛡️ DEFENSIVE SECURITY &amp; SANDBOXING <tspan fill="#8B949E" font-weight="normal">(Access Control · Cryptography · Memory Safety)</tspan></text>
    <text x="850" y="42" text-anchor="end" class="mono-pct">95% [HARDENED]</text>
    <rect x="0" y="50" width="850" height="9" rx="3" fill="#161B22" />
    <rect x="0" y="50" width="807" height="9" rx="3" fill="url(#barGrad1)" class="pulse-meter" />

    <!-- Skill 3 -->
    <text x="0" y="84" class="mono-lbl">⚡ LOW-LEVEL SYSTEMS &amp; LINUX INTERNALS <tspan fill="#8B949E" font-weight="normal">(C/C++ · POSIX · Systemd · Kernel · Bash/Zsh)</tspan></text>
    <text x="850" y="84" text-anchor="end" class="mono-pct">93% [ENFORCED]</text>
    <rect x="0" y="92" width="850" height="9" rx="3" fill="#161B22" />
    <rect x="0" y="92" width="790" height="9" rx="3" fill="url(#barGrad2)" class="pulse-meter" />

    <!-- Skill 4 -->
    <text x="0" y="126" class="mono-lbl">🔍 DATA PIPELINES &amp; PARSING ENGINES <tspan fill="#8B949E" font-weight="normal">(Python 3.12 · SQLite · Tokenization · Automation)</tspan></text>
    <text x="850" y="126" text-anchor="end" class="mono-pct">96% [COMPILED]</text>
    <rect x="0" y="134" width="850" height="9" rx="3" fill="#161B22" />
    <rect x="0" y="134" width="816" height="9" rx="3" fill="url(#barGrad2)" class="pulse-meter" />

    <!-- Skill 5 -->
    <text x="0" y="168" class="mono-lbl">⚙️ DEVSECOPS &amp; REPRODUCIBLE BUILDS <tspan fill="#8B949E" font-weight="normal">(Docker · QEMU Virtualization · Gradle/KTS · CI/CD)</tspan></text>
    <text x="850" y="168" text-anchor="end" class="mono-pct">92% [LOCKED]</text>
    <rect x="0" y="176" width="850" height="9" rx="3" fill="#161B22" />
    <rect x="0" y="176" width="782" height="9" rx="3" fill="url(#barGrad3)" class="pulse-meter" />

  </g>
</svg>
